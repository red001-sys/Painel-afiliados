name: Build APK e AAB

on:
  workflow_dispatch:
    inputs:
      buildType:
        description: 'Tipo de build'
        type: choice
        options:
          - apk
          - aab
          - both
        default: both
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ github.event.inputs.buildType || 'both' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze
        continue-on-error: true

      - name: Testes
        run: flutter test
        continue-on-error: true

      # A keystore vem em base64 no secret. O build.gradle.kts decodifica
      # automaticamente via ANDROID_KEYSTORE_BASE64 (ver android/app/build.gradle.kts).
      - name: Build APK (Release)
        if: ${{ github.event.inputs.buildType == 'apk' || github.event.inputs.buildType == 'both' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Build AAB (Release)
        if: ${{ github.event.inputs.buildType == 'aab' || github.event.inputs.buildType == 'both' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Upload APK
        if: ${{ github.event.inputs.buildType == 'apk' || github.event.inputs.buildType == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: |
            build/app/outputs/flutter-apk/*.apk

      - name: Upload AAB
        if: ${{ github.event.inputs.buildType == 'aab' || github.event.inputs.buildType == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: aab-release
          path: |
            build/app/outputs/bundle/release/*.aab
