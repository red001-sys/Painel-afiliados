name: Flutter Build

on:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Verify keystore alias
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "Verificando alias '$ANDROID_KEY_ALIAS' na keystore..."
          if ! keytool -list -keystore android/app/upload-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::O secret ANDROID_KEY_ALIAS ('$ANDROID_KEY_ALIAS') não corresponde a nenhum alias dentro da keystore decodificada. Confira os aliases abaixo e corrija o secret ANDROID_KEY_ALIAS (ou ANDROID_KEYSTORE_BASE64, se a keystore estiver desatualizada)."
            keytool -list -keystore android/app/upload-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi
          echo "Alias '$ANDROID_KEY_ALIAS' confirmado na keystore."

      - name: Create key.properties
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - run: flutter pub get

      - run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols

      - run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/symbols
          # Guarda por mais tempo que o padrão — sem isso, um crash relatado
          # daqui a meses vem com um stack trace ofuscado e ilegível, sem
          # jeito de saber qual linha do código realmente quebrou.
          retention-days: 90

  build-web:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter build web

      - name: Deploy Vercel
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel --prod --token=$VERCEL_TOKEN --yes
        working-directory: build/web
